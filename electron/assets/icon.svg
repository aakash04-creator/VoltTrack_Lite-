<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" filter="url(#glow)"/>
  
  <!-- Accent Ring -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Lines for Energy Meter Theme -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Lightning Bolt (VoltTrack Theme) -->
  <path d="M280 84 L170 264 L250 264 L232 428 L342 248 L262 248 Z" 
        fill="url(#bolt)" 
        filter="url(#glow)"/>
</svg>
